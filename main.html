<!DOCTYPE html>
<html>
    <head>
        <title>Monster Counter</title>
        <style>
            @import url('style.css');
        </style>
    </head>
    <body>
        <div class="app">
            <header>
                <div>
                    <button class="grey-button" onclick="settingsPopup.open()">Settings</button>
                </div>
                <h1>Monster Counter</h1>
                <div>
                    <button class="red-button" onclick="monsterManager.clear()">Clear</button>
                    <button class="red-button" onclick="monsterManager.removeDead()">Remove Dead</button>
                    <button class="green-button" onclick="addMonsterPopup.open()">Add</button>
                </div>
            </header>
            <div id="monsterList"></div>
        </div>
        <script type="module">
            import { MonsterManager } from './services/MonsterManager.js';
            import { AddMonsterPopup } from "./components/AddMonsterPopup.js";
            import { SettingsManager } from './services/SettingsManager.js';
            import { InfoService } from './services/InfoService.js';

            import { SettingsPopup } from "./components/SettingsPopup.js";
            import { TableHeadersTableRow } from './components/TableHeaderRow.js';
            import { MonsterTableRow } from './components/MonsterTableRow.js';

            // Global Managers & Popups
            globalThis.infoService = new InfoService();
            globalThis.monsterManager = new MonsterManager();
            globalThis.infoService.updateMonsterIndex().then(() => {
                globalThis.addMonsterPopup = AddMonsterPopup();
            });
            globalThis.settingsManager = new SettingsManager();
            globalThis.settingsPopup = SettingsPopup();
            
            // Create & Update Table
            globalThis.updateTable = () => {
                const monsterTable = document.getElementById('monsterList');
                monsterTable.innerHTML = '';
                
                const table = document.createElement('table');
                table.appendChild(TableHeadersTableRow());
                
                monsterManager.monsters.forEach(monster => {
                    table.appendChild(MonsterTableRow(monster, monsterManager));
                });
                
                monsterTable.appendChild(table);
            }

            globalThis.updateTable();
        </script>
    </body>
</html>
