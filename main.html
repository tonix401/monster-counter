<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Monster Counter</title>
        <style>
            @import url('style.css');
        </style>
    </head>
    <body>
        <div class="app">
            <header>
                <div>
                    <button class="green-button" onclick="settingsPopup.open()" title="Open Settings">Settings</button>
                    <button id="xp-counter" style="display: none;" title="Reset XP Counter" class="red-button transparent-button" onclick="XpCounterManager.resetXp()">0 XP</button>
                </div>
                <h2>Monster Counter</h2>
                <div>
                    <button class="red-button" onclick="monsterManager.clear()" title="Clear all Monsters without applying XP">Clear</button>
                    <button class="red-button" onclick="monsterManager.killAll()" title="Kill all Monsters and apply XP">Kill All</button>
                    <button class="red-button" onclick="monsterManager.removeDead()" title="Remove all dead Monsters">Remove Dead</button>
                    <button class="green-button" onclick="addMonsterPopup.open()" title="Add new Monsters">Add</button>
                </div>
            </header>
            <div id="monsterList"></div>
        </div>
        <script type="module">
            import { MonsterManager } from './services/MonsterManager.js';
            import { AddMonsterPopup } from "./components/AddMonsterPopup.js";
            import { SettingsManager } from './services/SettingsManager.js';
            import { InfoManager } from './services/InfoManager.js';
            import { XpCounterManager } from './services/XpCounterManager.js';

            import { SettingsPopup } from "./components/SettingsPopup.js";
            import { TableHeadersTableRow } from './components/TableHeaderRow.js';
            import { MonsterTableRow } from './components/MonsterTableRow.js';
            import { TableColgroup } from './components/TableColgroup.js';

            // Global Managers & Popups
            globalThis.InfoManager = new InfoManager();
            globalThis.monsterManager = new MonsterManager();
            globalThis.settingsManager = new SettingsManager();
            globalThis.XpCounterManager = new XpCounterManager();
            globalThis.settingsPopup = SettingsPopup();
            globalThis.InfoManager.updateMonsterIndex().then(() => {
                globalThis.addMonsterPopup = AddMonsterPopup();
            });
            
            // Create & Update Table
            globalThis.updateTable = () => {
                const monsterListRoot = document.getElementById('monsterList');
                monsterListRoot.innerHTML = '';

                const table = document.createElement('table');
                table.appendChild(TableColgroup());
                table.appendChild(TableHeadersTableRow());
                
                monsterManager.monsters.forEach(monster => {
                    table.appendChild(MonsterTableRow(monster, monsterManager));
                });
                
                monsterListRoot.appendChild(table);
            }

            globalThis.updateTable();
        </script>
    </body>
</html>
